[project]
name = "ha-birthday-calendar"
version = "0.1.1"
description = "A component for Home Assistant that creates a calendar entity from a CardDAV addressbook, extracting birthdays from contact VCards."
readme = "README.md"
requires-python = ">=3.14.3"
license = "MIT"
dependencies = [
    "aiohttp>=3.14.3",
    "defusedxml>=0.7.1",
    "vobject>=0.9.9",
]

[dependency-groups]
dev = [
    "pytest-homeassistant-custom-component>=0.13.348",
    "pytest-cov>=7.1.0",
    "mypy>=2.3.0",
    "bandit>=1.9.4",
    "pylint>=4.0.6",
    "types-vobject>=0.9.9.20260518",
    "flake8>=7.3.0",
    "ruff>=0.16.0",
    "types-defusedxml>=0.7.0.20260504",
]

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = [
    "vobject.*",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["custom_components/birthday_calendar"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
[tool.pylint.MAIN]
ignore = [
    ".venv",
    ".git",
    "tests",
    "__pycache__",
    "build",
    "dist",
]

[tool.pylint.FORMAT]
max-line-length = 88

[tool.pylint."MESSAGES CONTROL"]
disable = [
    "C0114", # missing-module-docstring
    "C0115", # missing-class-docstring
    "C0116", # missing-function-docstring
]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "build", "dist"]
